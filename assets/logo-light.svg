    <path d="M4 12 L4 4 L12 4" fill="none" stroke="#00b770" stroke-width="2" stroke-linecap="square"/>
    <path d="M60 52 L60 60 L52 60" fill="none" stroke="#00b770" stroke-width="2" stroke-linecap="square"/>
    <line x1="10" y1="45" x2="54" y2="45" stroke="#5a6573" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
