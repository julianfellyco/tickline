<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="tickline mark">
  <title>tickline</title>
  <!-- frame -->
  <rect x="4" y="4" width="56" height="56" rx="3" fill="none" stroke="#e8eef5" stroke-width="2"/>
  <!-- corner ticks: signal of a framed instrument -->
  <path d="M4 12 L4 4 L12 4" fill="none" stroke="#00ff9d" stroke-width="2" stroke-linecap="square"/>
  <path d="M60 52 L60 60 L52 60" fill="none" stroke="#00ff9d" stroke-width="2" stroke-linecap="square"/>
  <!-- baseline (dashed, faint) -->
  <line x1="10" y1="45" x2="54" y2="45" stroke="#8b96a5" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- equity curve -->
  <polyline points="10,42 17,40 23,44 30,34 37,36 44,24 48,20"
            fill="none"
            stroke="#00ff9d"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"/>
  <!-- terminating candle (wick + body) -->
  <line x1="50" y1="12" x2="50" y2="26" stroke="#00ff9d" stroke-width="2" stroke-linecap="round"/>
  <rect x="47" y="14" width="6" height="8" fill="#00ff9d"/>
</svg>
