<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#07090c"/>
  <!-- baseline -->
  <line x1="6" y1="22" x2="26" y2="22" stroke="#1c2530" stroke-width="1"/>
  <!-- equity curve -->
  <polyline points="6,20 10,18 14,21 18,14 22,16 25,9"
            fill="none" stroke="#00ff9d" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- terminating candle -->
  <line x1="25" y1="5" x2="25" y2="12" stroke="#00ff9d" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="23" y="6" width="4" height="5" fill="#00ff9d"/>
</svg>
